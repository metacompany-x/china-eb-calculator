name: Update Visa Bulletin dates

on:
  schedule:
    - cron: "17 15 * * *"   # daily, about 7–8am Pacific
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-bulletin
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the latest Visa Bulletin
        run: python3 scripts/update_bulletin.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- data.json sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json sitemap.xml
          git commit -m "Update Final Action Dates from $(python3 -c 'import json;print(json.load(open("data.json"))["bulletin"])') Visa Bulletin"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
